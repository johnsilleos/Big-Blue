version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: weather_db
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: weather_pass
    volumes:
      - pgdata:/var/lib/postgresql/data

  weather_app:
    build: .
    depends_on:
      - postgres

volumes:
  pgdata:
